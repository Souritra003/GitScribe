spring.application.name=docpilot-backend
server.port=8080

# GitHub OAuth App
github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}
github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/github/callback}
github.frontend-url=${GITHUB_FRONTEND_URL:http://localhost:5173}

# Gemini
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Analysis limits
docpilot.max-files=${DOCPILOT_MAX_FILES:150}
docpilot.max-file-size-bytes=${DOCPILOT_MAX_FILE_SIZE_BYTES:200000}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
